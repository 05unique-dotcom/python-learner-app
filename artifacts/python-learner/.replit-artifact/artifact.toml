kind = "web"
previewPath = "/"
title = "Python Learner"
version = "1.0.0"
id = "artifacts/python-learner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19857

[services.development]
run = "pnpm --filter @workspace/python-learner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/python-learner", "run", "build" ]
publicDir = "artifacts/python-learner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19857"
BASE_PATH = "/"
